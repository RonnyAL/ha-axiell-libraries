name: Validate

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.11.0"
            requirements: requirements-min.txt
          - core: "2026.11.1"
            requirements: requirements-dev.txt
    env:
      HA_VERSION: ${{ matrix.core }}
      REQUIREMENTS_FILE: ${{ matrix.requirements }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r "$REQUIREMENTS_FILE"
      - name: Assert actual Core and official harness versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import os
          import platform
          import sys

          print("Python:", platform.python_version())
          assert sys.version_info[:2] == (3, 14)
          for package in ("homeassistant", "pytest-homeassistant"):
              actual = version(package)
              print(f"{package}: {actual}")
              assert actual == os.environ["HA_VERSION"]
          PY
      - run: python -m pytest -q
