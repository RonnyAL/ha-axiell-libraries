name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Manifest version to publish (plain X.Y.Z, no v prefix)
        required: true
        default: "0.2.0"
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yaml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Require exact manifest and tag agreement
        run: python scripts/check_release.py "$RELEASE_VERSION"
      - name: Create tag and publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creating the ref atomically refuses an existing tag, including one
          # pointing at a different commit. Never move a published version.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_VERSION}" -f sha="$GITHUB_SHA"
          gh release create "$RELEASE_VERSION" --verify-tag \
            --title "$RELEASE_VERSION" --generate-notes
